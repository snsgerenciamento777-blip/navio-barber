version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: navio-barber-postgres
    environment:
      POSTGRES_USER: navio_barber
      POSTGRES_PASSWORD: navio_barber_dev
      POSTGRES_DB: navio_barber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navio_barber -d navio_barber"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: navio-barber-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: